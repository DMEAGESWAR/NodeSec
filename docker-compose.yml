services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: nodesec
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nodesec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodesec"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./nodesec-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://nodesec:password@db:5432/nodesec
      SECRET_KEY: dev-secret-key-change-in-production-123
      ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./nodesec-backend:/app

  frontend:
    build:
      context: ./nodesec-frontend
      dockerfile: Dockerfile
      target: builder
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./nodesec-frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
